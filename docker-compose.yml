# docker-compose.yml
# 使用前请先创建后端环境配置文件：
#   cp backend/.env.example backend/.env.dev
#   然后编辑 backend/.env.dev 填写 API Key 和模型配置

services:
  redis:
    image: redis:alpine
    container_name: mmmaker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmmaker_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    environment:
      - ENV=DEV
      - REDIS_URL=redis://redis:6379/0
    # 仅挂载 app 源码和工作目录，避免覆盖容器内 .venv 等构建产物
    volumes:
      - ./backend/app:/app/app
      - ./backend/project/work_dir:/app/project/work_dir
    depends_on:
      - redis
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmmaker_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  redis_data:
